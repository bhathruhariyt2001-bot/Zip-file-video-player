---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VLC Stream Player</title>
  <style>
    :root { --vlc: #ff8800; --bg: #000; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #1f2937;
      color: #fff;
      border: 1px dashed var(--vlc);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #debugBox {
      background: #000;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #videoContainer {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      z-index: 999;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="card" id="uiCard">
    <h2 style="color:var(--vlc);">VLC Stream Engine</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">Select scrambled .zip archive (supports 10GB+ with zero RAM usage).</p>
    
    <input type="file" id="directPicker" />
    <div id="debugBox">Initializing worker engine...</div>
  </div>

  <div id="videoContainer">
    <video id="player" controls playsinline></video>
  </div>

<!-- Embedded Service Worker Script -->
<script id="sw-script" type="text/plain">
const XOR_KEY = 0xAA;
let activeArchive = null;

self.addEventListener('install', (e) => self.skipWaiting());
self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));

self.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'INIT_ARCHIVE') {
    activeArchive = event.data.payload;
    if (event.ports && event.ports[0]) {
      event.ports[0].postMessage({ status: 'READY' });
    }
  }
});

async function getFileDataOffset(file, localOffset) {
  const hdrBuf = await file.slice(localOffset, localOffset + 30).arrayBuffer();
  const v = new DataView(hdrBuf);
  return localOffset + 30 + v.getUint16(26, true) + v.getUint16(28, true);
}

self.addEventListener('fetch', (event) => {
  const url = new URL(event.request.url);
  if (!url.pathname.endsWith('/stream-virtual-video.mp4') || !activeArchive) {
    return;
  }

  event.respondWith((async () => {
    const { file, chunksMap, totalSize, mime } = activeArchive;
    const rangeHeader = event.request.headers.get('range');

    let start = 0;
    let end = totalSize - 1;

    if (rangeHeader) {
      const match = rangeHeader.match(/bytes=(\d+)-(\d*)/);
      if (match) {
        start = parseInt(match[1], 10);
        if (match[2]) end = parseInt(match[2], 10);
      }
    }

    if (start >= totalSize || end >= totalSize) {
      return new Response(null, {
        status: 416,
        headers: { 'Content-Range': `bytes */${totalSize}` }
      });
    }

    const requestedLength = (end - start) + 1;

    // Stream on-demand chunks directly through Range requests
    const stream = new ReadableStream({
      async start(controller) {
        let currentPos = start;

        let cIdx = 0;
        while (cIdx < chunksMap.length && (chunksMap[cIdx].startOffset + chunksMap[cIdx].size) <= currentPos) {
          cIdx++;
        }

        while (currentPos <= end && cIdx < chunksMap.length) {
          const item = chunksMap[cIdx];
          const chunkInPos = currentPos - item.startOffset;
          const chunkRem = item.size - chunkInPos;
          const toRead = Math.min(chunkRem, (end - currentPos) + 1);

          const payloadBase = await getFileDataOffset(file, item.localOffset);
          const sliceStart = payloadBase + chunkInPos;
          const raw = await file.slice(sliceStart, sliceStart + toRead).arrayBuffer();

          const u8 = new Uint8Array(raw);
          for (let b = 0; b < u8.length; b++) {
            u8[b] ^= XOR_KEY;
          }

          controller.enqueue(u8);
          currentPos += toRead;
          cIdx++;
        }

        controller.close();
      }
    });

    return new Response(stream, {
      status: 206,
      headers: {
        'Content-Type': mime || 'video/mp4',
        'Content-Range': `bytes ${start}-${end}/${totalSize}`,
        'Content-Length': requestedLength.toString(),
        'Accept-Ranges': 'bytes'
      }
    });
  })());
});
</script>

<script>
  const picker = document.getElementById('directPicker');
  const debug = document.getElementById('debugBox');
  const card = document.getElementById('uiCard');
  const container = document.getElementById('videoContainer');
  const player = document.getElementById('player');

  function log(msg) {
    debug.innerText += "\n> " + msg;
    debug.scrollTop = debug.scrollHeight;
  }

  // Self-register service worker on GitHub Pages
  let swReady = false;
  async function initWorker() {
    if (!('serviceWorker' in navigator)) {
      log("Error: Service Workers not supported in this browser.");
      return;
    }
    try {
      const swCode = document.getElementById('sw-script').textContent;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      
      const reg = await navigator.serviceWorker.register(swUrl, { scope: './' });
      await navigator.serviceWorker.ready;
      swReady = true;
      log("Ready: Worker loaded successfully on GitHub.");
    } catch (err) {
      log("Worker Init Error: " + err.message);
    }
  }

  initWorker();

  async function getFileDataOffset(file, localOffset) {
    const hdrBuf = await file.slice(localOffset, localOffset + 30).arrayBuffer();
    const v = new DataView(hdrBuf);
    return localOffset + 30 + v.getUint16(26, true) + v.getUint16(28, true);
  }

  picker.addEventListener('change', async (e) => {
    try {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      log(`File: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`);
      log("Scanning archive index...");

      const tailSize = Math.min(file.size, 131072);
      const tailBuf = await file.slice(file.size - tailSize, file.size).arrayBuffer();
      const tailView = new DataView(tailBuf);
      
      let cdOffset = 0n, cdSize = 0n, isZip64 = false;

      for (let i = tailBuf.byteLength - 20; i >= 0; i--) {
        if (tailView.getUint32(i, true) === 0x07064b50) {
          isZip64 = true;
          const z64Offset = tailView.getBigUint64(i + 8, true);
          const z64Buf = await file.slice(Number(z64Offset), Number(z64Offset) + 56).arrayBuffer();
          const z64View = new DataView(z64Buf);
          cdSize = z64View.getBigUint64(40, true);
          cdOffset = z64View.getBigUint64(48, true);
          break;
        }
      }

      if (!isZip64) {
        let eocd = -1;
        for (let i = tailBuf.byteLength - 22; i >= 0; i--) {
          if (tailView.getUint32(i, true) === 0x06054b50) {
            eocd = file.size - tailSize + i;
            break;
          }
        }
        if (eocd === -1) throw new Error("Not a valid ZIP archive.");
        const eocdSlice = await file.slice(eocd, eocd + 22).arrayBuffer();
        const ev = new DataView(eocdSlice);
        cdSize = BigInt(ev.getUint32(12, true));
        cdOffset = BigInt(ev.getUint32(16, true));
      }

      const cdBuf = await file.slice(Number(cdOffset), Number(cdOffset + cdSize)).arrayBuffer();
      const cdView = new DataView(cdBuf);
      const files = {};
      let ptr = 0;

      while (ptr < cdBuf.byteLength) {
        if (cdView.getUint32(ptr, true) !== 0x02014b50) break;
        let size = BigInt(cdView.getUint32(ptr + 20, true));
        const nameLen = cdView.getUint16(ptr + 28, true);
        const extraLen = cdView.getUint16(ptr + 30, true);
        const commentLen = cdView.getUint16(ptr + 32, true);
        let localOffset = BigInt(cdView.getUint32(ptr + 42, true));

        const nameBytes = new Uint8Array(cdBuf, ptr + 46, nameLen);
        const name = new TextDecoder().decode(nameBytes);

        if (localOffset === 0xFFFFFFFFn && extraLen > 0) {
          let ePtr = ptr + 46 + nameLen;
          while (ePtr < ptr + 46 + nameLen + extraLen) {
            if (cdView.getUint16(ePtr, true) === 0x0001) {
              localOffset = cdView.getBigUint64(ePtr + 4, true);
              break;
            }
            ePtr += 4 + cdView.getUint16(ePtr + 2, true);
          }
        }

        files[name] = { size: Number(size), localOffset: Number(localOffset) };
        ptr += 46 + nameLen + extraLen + commentLen;
      }

      if (!files['manifest.json']) throw new Error("manifest.json missing.");

      // Parse manifest
      const mEntry = files['manifest.json'];
      const mOffset = await getFileDataOffset(file, mEntry.localOffset);
      const mBuf = await file.slice(mOffset, mOffset + mEntry.size).arrayBuffer();
      const manifest = JSON.parse(new TextDecoder().decode(mBuf));

      // Build chunk index map
      let runningOffset = 0;
      const chunksMap = [];
      for (const name of manifest.chunks) {
        const item = files[name];
        chunksMap.push({
          localOffset: item.localOffset,
          size: item.size,
          startOffset: runningOffset
        });
        runningOffset += item.size;
      }

      log(`Found ${manifest.chunks.length} chunks (${(runningOffset / (1024*1024)).toFixed(1)} MB total).`);
      log("Connecting virtual HTTP pipeline...");

      const channel = new MessageChannel();
      const swTarget = navigator.serviceWorker.controller || (await navigator.serviceWorker.ready).active;

      swTarget.postMessage({
        type: 'INIT_ARCHIVE',
        payload: {
          file,
          chunksMap,
          totalSize: runningOffset,
          mime: manifest.mime || 'video/mp4'
        }
      }, [channel.port2]);

      channel.port1.onmessage = () => {
        // Points to the virtual route inside the current GitHub Pages directory
        player.src = `./stream-virtual-video.mp4?v=${Date.now()}`;
        card.style.display = 'none';
        container.style.display = 'block';

        if (container.requestFullscreen) container.requestFullscreen().catch(() => {});
        player.play().catch(e => log("Autoplay blocked, tap to play."));
      };

    } catch (err) {
      log("ERROR: " + err.message);
      console.error(err);
    }
  });
</script>
</body>
</html>
