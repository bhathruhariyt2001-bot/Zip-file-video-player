---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VLC 3-Chunk Stream Player</title>
  <style>
    :root { 
      --vlc: #ff8800; 
      --bg: #000; 
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    body {
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    input, select, button { 
      user-select: auto; 
      -webkit-user-select: auto; 
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      z-index: 10;
    }
    input[type="file"] {
      width: 100%;
      padding: 16px;
      background: #1f2937;
      color: #fff;
      border: 2px dashed var(--vlc);
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      display: block;
    }
    #debugBox {
      background: #000;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #videoContainer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      overflow: hidden;
    }
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.85) 100%);
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .video-overlay.hidden { 
      opacity: 0; 
      pointer-events: none; 
    }
    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 16px 20px; 
      font-size: 0.95rem; 
    }
    .center-controls {
      position: absolute;
      top: 50%; 
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .center-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      color: #fff;
      width: 56px; 
      height: 56px;
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer;
    }
    .center-btn svg { 
      width: 28px; 
      height: 28px; 
      fill: #fff; 
    }
    .tap-indicator {
      position: absolute; 
      top: 0; 
      bottom: 0; 
      width: 40%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 0.85rem; 
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.2s ease;
    }
    .tap-indicator.left { 
      left: 0; 
      border-radius: 0 100px 100px 0; 
    }
    .tap-indicator.right { 
      right: 0; 
      border-radius: 100px 0 0 100px; 
    }
    .tap-indicator.show { 
      opacity: 1; 
    }
    .bottom-bar { 
      padding: 10px 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    .progress-bar-container { 
      position: relative; 
      height: 20px; 
      display: flex; 
      align-items: center; 
      cursor: pointer; 
    }
    .seek-slider { 
      -webkit-appearance: none; 
      width: 100%; 
      height: 4px; 
      border-radius: 2px; 
      background: rgba(255,255,255,0.3); 
      outline: none; 
    }
    .seek-slider::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      width: 14px; 
      height: 14px; 
      border-radius: 50%; 
      background: var(--vlc); 
      cursor: pointer; 
    }
    .controls-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      font-size: 0.85rem; 
    }
    .controls-left, .controls-right { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
    }
    .icon-btn { 
      background: none; 
      border: none; 
      color: #fff; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 6px; 
    }
    .icon-btn svg { 
      width: 22px; 
      height: 22px; 
      fill: #fff; 
    }
    select.speed-select { 
      background: rgba(255,255,255,0.15); 
      border: none; 
      color: #fff; 
      padding: 4px 6px; 
      border-radius: 4px; 
      font-size: 0.8rem; 
    }
    select.speed-select option { 
      background: #111; 
      color: #fff; 
    }
  </style>
</head>
<body>

  <div class="card" id="uiCard">
    <h2 style="color:var(--vlc);">VLC 3-Chunk Streamer</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">3-Chunk FIFO eviction rule • Zero RAM overload</p>
    
    <input 
      type="file" 
      id="directPicker" 
      accept=".zip,application/zip,application/x-zip-compressed,multipart/x-zip,*/*"
    />
    <div id="debugBox">Ready. Tap to choose archive...</div>
  </div>

  <div id="videoContainer">
    <video id="player" playsinline></video>

    <div class="tap-indicator left" id="skipLeftFeedback">⏪ 10s</div>
    <div class="tap-indicator right" id="skipRightFeedback">10s ⏩</div>

    <div class="video-overlay" id="overlay">
      <div class="top-bar">
        <span id="titleDisplay">Streaming Video</span>
        <button class="icon-btn" id="exitBtn" title="Close">✕</button>
      </div>

      <div class="center-controls">
        <button class="center-btn" id="rwBtn" title="Rewind 10s">
          <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="center-btn" id="mainPlayBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="center-btn" id="ffBtn" title="Forward 10s">
          <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        </button>
      </div>

      <div class="bottom-bar">
        <div class="progress-bar-container">
          <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" step="0.1" />
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button class="icon-btn" id="bottomPlayBtn">
              <svg id="bottomPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="icon-btn" id="muteBtn">
              <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <span id="timeCounter">00:00 / 00:00</span>
          </div>

          <div class="controls-right">
            <select class="speed-select" id="speedPicker">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>
            <button class="icon-btn" id="fsBtn" title="Fullscreen">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const XOR_KEY = 0xAA;
  const picker = document.getElementById('directPicker');
  const debug = document.getElementById('debugBox');
  const card = document.getElementById('uiCard');
  const container = document.getElementById('videoContainer');
  const player = document.getElementById('player');
  const overlay = document.getElementById('overlay');
  const titleDisplay = document.getElementById('titleDisplay');
  const exitBtn = document.getElementById('exitBtn');

  const mainPlayBtn = document.getElementById('mainPlayBtn');
  const bottomPlayBtn = document.getElementById('bottomPlayBtn');
  const playIcon = document.getElementById('playIcon');
  const bottomPlayIcon = document.getElementById('bottomPlayIcon');
  const seekSlider = document.getElementById('seekSlider');
  const timeCounter = document.getElementById('timeCounter');
  const muteBtn = document.getElementById('muteBtn');
  const volIcon = document.getElementById('volIcon');
  const speedPicker = document.getElementById('speedPicker');
  const fsBtn = document.getElementById('fsBtn');
  const rwBtn = document.getElementById('rwBtn');
  const ffBtn = document.getElementById('ffBtn');
  const skipLeftFeedback = document.getElementById('skipLeftFeedback');
  const skipRightFeedback = document.getElementById('skipRightFeedback');

  function log(msg) {
    debug.innerText += "\n> " + msg;
    debug.scrollTop = debug.scrollHeight;
  }

  async function getFileDataOffset(file, localOffset) {
    const hdrBuf = await file.slice(localOffset, localOffset + 30).arrayBuffer();
    const v = new DataView(hdrBuf);
    return localOffset + 30 + v.getUint16(26, true) + v.getUint16(28, true);
  }

  picker.addEventListener('click', () => { 
    picker.value = ''; 
  });

  async function processArchive(file) {
    try {
      log(`Opening: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`);
      log("Reading ZIP header...");

      const tailSize = Math.min(file.size, 131072);
      const tailBuf = await file.slice(file.size - tailSize, file.size).arrayBuffer();
      const tailView = new DataView(tailBuf);
      
      let cdOffset = 0n, cdSize = 0n, isZip64 = false;

      for (let i = tailBuf.byteLength - 20; i >= 0; i--) {
        if (tailView.getUint32(i, true) === 0x07064b50) {
          isZip64 = true;
          const z64Offset = tailView.getBigUint64(i + 8, true);
          const z64Buf = await file.slice(Number(z64Offset), Number(z64Offset) + 56).arrayBuffer();
          const z64View = new DataView(z64Buf);
          cdSize = z64View.getBigUint64(40, true);
          cdOffset = z64View.getBigUint64(48, true);
          break;
        }
      }

      if (!isZip64) {
        let eocd = -1;
        for (let i = tailBuf.byteLength - 22; i >= 0; i--) {
          if (tailView.getUint32(i, true) === 0x06054b50) {
            eocd = file.size - tailSize + i;
            break;
          }
        }
        if (eocd === -1) throw new Error("Invalid ZIP.");
        const eocdSlice = await file.slice(eocd, eocd + 22).arrayBuffer();
        const ev = new DataView(eocdSlice);
        cdSize = BigInt(ev.getUint32(12, true));
        cdOffset = BigInt(ev.getUint32(16, true));
      }

      const cdBuf = await file.slice(Number(cdOffset), Number(cdOffset + cdSize)).arrayBuffer();
      const cdView = new DataView(cdBuf);
      const files = {};
      let ptr = 0;

      while (ptr < cdBuf.byteLength) {
        if (cdView.getUint32(ptr, true) !== 0x02014b50) break;
        let size = BigInt(cdView.getUint32(ptr + 20, true));
        const nameLen = cdView.getUint16(ptr + 28, true);
        const extraLen = cdView.getUint16(ptr + 30, true);
        const commentLen = cdView.getUint16(ptr + 32, true);
        let localOffset = BigInt(cdView.getUint32(ptr + 42, true));

        const nameBytes = new Uint8Array(cdBuf, ptr + 46, nameLen);
        const name = new TextDecoder().decode(nameBytes);

        if (localOffset === 0xFFFFFFFFn && extraLen > 0) {
          let ePtr = ptr + 46 + nameLen;
          while (ePtr < ptr + 46 + nameLen + extraLen) {
            if (cdView.getUint16(ePtr, true) === 0x0001) {
              localOffset = cdView.getBigUint64(ePtr + 4, true);
              break;
            }
            ePtr += 4 + cdView.getUint16(ePtr + 2, true);
          }
        }

        files[name] = { size: Number(size), localOffset: Number(localOffset) };
        ptr += 46 + nameLen + extraLen + commentLen;
      }

      if (!files['manifest.json']) throw new Error("manifest.json missing.");

      const mEntry = files['manifest.json'];
      const mOffset = await getFileDataOffset(file, mEntry.localOffset);
      const mBuf = await file.slice(mOffset, mOffset + mEntry.size).arrayBuffer();
      const manifest = JSON.parse(new TextDecoder().decode(mBuf));

      const totalChunks = manifest.chunks.length;
      log(`Manifest: ${manifest.name || 'Video'} (${totalChunks} chunks)`);

      // ==========================================
      // 3-CHUNK FIFO RAM PIPELINE
      // ==========================================
      // Holds maximum 3 chunks in memory at any time: [cur-1, cur, cur+1]
      const ramCache = new Map(); 
      let activeBlobUrl = null;

      async function fetchDecryptedChunk(index) {
        if (index < 0 || index >= totalChunks) return null;
        if (ramCache.has(index)) return ramCache.get(index);

        const cName = manifest.chunks[index];
        const entry = files[cName];
        if (!entry) return null;

        const offset = await getFileDataOffset(file, entry.localOffset);
        const raw = await file.slice(offset, offset + entry.size).arrayBuffer();
        const u8 = new Uint8Array(raw);
        for (let b = 0; b < u8.length; b++) {
          u8[b] ^= XOR_KEY;
        }

        ramCache.set(index, u8);
        return u8;
      }

      function enforce3ChunkRamEviction(centerIndex) {
        // Strict RAM Eviction Rule: Keep only centerIndex-1, centerIndex, centerIndex+1
        const keepKeys = new Set([centerIndex - 1, centerIndex, centerIndex + 1]);
        for (const key of ramCache.keys()) {
          if (!keepKeys.has(key)) {
            ramCache.delete(key); // Instantly reclaimed by GC
          }
        }
      }

      log("Loading initial 3 chunks into RAM...");
      await fetchDecryptedChunk(0);
      if (totalChunks > 1) await fetchDecryptedChunk(1);
      if (totalChunks > 2) await fetchDecryptedChunk(2);

      // Build initial playback Blob with strictly 3 chunks in RAM
      const initParts = [ramCache.get(0), ramCache.get(1), ramCache.get(2)].filter(Boolean);
      const initialBlob = new Blob(initParts, { type: manifest.mime || 'video/mp4' });
      activeBlobUrl = URL.createObjectURL(initialBlob);
      player.src = activeBlobUrl;

      titleDisplay.innerText = manifest.name || file.name;
      card.style.display = 'none';
      container.style.display = 'block';

      try {
        if (container.requestFullscreen) await container.requestFullscreen();
        else if (container.webkitRequestFullscreen) await container.webkitRequestFullscreen();
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
      } catch (_) {}

      player.play().catch(() => log("Tap screen to start"));
      showOverlay();

      // ==========================================
      // DYNAMIC 3-CHUNK ROLLING ENGINE
      // ==========================================
      let lastReportedChunk = 0;
      let isRolling = false;

      player.addEventListener('timeupdate', async () => {
        if (!player.duration || isRolling) return;

        // Estimate current chunk based on playback progress
        const currentProgress = player.currentTime / player.duration;
        const currentChunkIdx = Math.min(totalChunks - 1, Math.floor(currentProgress * totalChunks));

        if (currentChunkIdx !== lastReportedChunk) {
          isRolling = true;
          lastReportedChunk = currentChunkIdx;

          // 1. Evict finished chunk behind us & fetch next chunk ahead
          enforce3ChunkRamEviction(currentChunkIdx);
          await fetchDecryptedChunk(currentChunkIdx + 1);

          log(`Playing chunk ${currentChunkIdx + 1}/${totalChunks} | RAM: ~${ramCache.size} chunks`);
          isRolling = false;
        }
      });

    } catch (err) {
      log("ERROR: " + err.message);
      console.error(err);
    }
  }

  let pickerActive = false;
  ['change', 'input'].forEach(evt => {
    picker.addEventListener(evt, async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file || pickerActive) return;
      pickerActive = true;
      await processArchive(file);
      pickerActive = false;
    });
  });

  // UI HUD Logic
  let overlayTimeout = null;
  function showOverlay() {
    overlay.classList.remove('hidden');
    clearTimeout(overlayTimeout);
    if (!player.paused) {
      overlayTimeout = setTimeout(() => overlay.classList.add('hidden'), 3000);
    }
  }

  function toggleOverlay() {
    if (overlay.classList.contains('hidden')) showOverlay();
    else overlay.classList.add('hidden');
  }

  function togglePlay() {
    if (player.paused) player.play();
    else player.pause();
    showOverlay();
  }

  function updatePlayIcons() {
    const playD = "M8 5v14l11-7z";
    const pauseD = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
    const path = player.paused ? playD : pauseD;
    playIcon.querySelector('path').setAttribute('d', path);
    bottomPlayIcon.querySelector('path').setAttribute('d', path);
  }

  mainPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  bottomPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  player.addEventListener('play', updatePlayIcons);
  player.addEventListener('pause', updatePlayIcons);

  function formatTime(sec) {
    if (isNaN(sec)) return "00:00";
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const ss = s < 10 ? '0' + s : s;
    return h > 0 ? `${h}:${m < 10 ? '0' + m : m}:${ss}` : `${m}:${ss}`;
  }

  let isSeeking = false;
  player.addEventListener('timeupdate', () => {
    if (!isSeeking && player.duration) {
      seekSlider.value = (player.currentTime / player.duration) * 100;
      timeCounter.innerText = `${formatTime(player.currentTime)} / ${formatTime(player.duration)}`;
    }
  });

  seekSlider.addEventListener('input', () => {
    isSeeking = true;
    showOverlay();
    if (player.duration) {
      const targetTime = (seekSlider.value / 100) * player.duration;
      timeCounter.innerText = `${formatTime(targetTime)} / ${formatTime(player.duration)}`;
    }
  });

  seekSlider.addEventListener('change', () => {
    if (player.duration) {
      player.currentTime = (seekSlider.value / 100) * player.duration;
    }
    isSeeking = false;
    showOverlay();
  });

  function seekOffset(offset) {
    player.currentTime = Math.max(0, Math.min(player.duration || 0, player.currentTime + offset));
    showOverlay();
  }
  rwBtn.addEventListener('click', (e) => { e.stopPropagation(); seekOffset(-10); });
  ffBtn.addEventListener('click', (e) => { e.stopPropagation(); seekOffset(10); });

  // YouTube Touch Gestures
  let lastTapTime = 0;
  let tapTimer = null;

  container.addEventListener('click', (e) => {
    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;

    const cur = Date.now();
    const tapLen = cur - lastTapTime;
    const clickX = e.clientX;
    const w = window.innerWidth;

    if (tapLen < 300 && tapLen > 0) {
      clearTimeout(tapTimer);
      if (clickX < w * 0.4) {
        seekOffset(-10);
        skipLeftFeedback.classList.add('show');
        setTimeout(() => skipLeftFeedback.classList.remove('show'), 500);
      } else if (clickX
