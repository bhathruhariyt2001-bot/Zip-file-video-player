---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VLC Player Stream Engine (MSE)</title>
  <style>
    :root { --vlc: #ff8800; --bg: #000; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #1f2937;
      color: #fff;
      border: 1px dashed var(--vlc);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #debugBox {
      background: #000;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #videoContainer {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      z-index: 999;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="card" id="uiCard">
    <h2 style="color:var(--vlc);">VLC Stream Player</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">Select scrambled .zip archive to stream via MSE</p>
    
    <input type="file" id="directPicker" />

    <div id="debugBox">Status: Waiting for file selection...</div>
  </div>

  <div id="videoContainer">
    <video id="player" controls playsinline></video>
  </div>

<script>
  const XOR_KEY = 0xAA;
  const picker = document.getElementById('directPicker');
  const debug = document.getElementById('debugBox');
  const card = document.getElementById('uiCard');
  const container = document.getElementById('videoContainer');
  const player = document.getElementById('player');

  function log(msg) {
    debug.innerText += "\n> " + msg;
    debug.scrollTop = debug.scrollHeight;
  }

  // Helper to resolve exact file payload offset by reading local header
  async function getFileDataOffset(file, localOffset) {
    const hdrBuf = await file.slice(localOffset, localOffset + 30).arrayBuffer();
    const v = new DataView(hdrBuf);
    if (v.getUint32(0, true) !== 0x04034b50) {
      throw new Error(`Invalid local header signature at ${localOffset}`);
    }
    const nameLen = v.getUint16(26, true);
    const extraLen = v.getUint16(28, true);
    return localOffset + 30 + nameLen + extraLen;
  }

  // Read and decrypt one chunk on demand
  async function readChunk(file, entry) {
    const dataOffset = await getFileDataOffset(file, entry.localOffset);
    const raw = await file.slice(dataOffset, dataOffset + entry.size).arrayBuffer();
    const u8 = new Uint8Array(raw);
    for (let i = 0; i < u8.length; i++) {
      u8[i] ^= XOR_KEY;
    }
    return u8;
  }

  picker.addEventListener('change', async (e) => {
    try {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      log(`File: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`);
      log("Scanning Central Directory...");

      // 1. Locate EOCD or ZIP64
      const tailSize = Math.min(file.size, 131072);
      const tailBuf = await file.slice(file.size - tailSize, file.size).arrayBuffer();
      const tailView = new DataView(tailBuf);
      
      let cdOffset = 0n;
      let cdSize = 0n;
      let isZip64 = false;

      for (let i = tailBuf.byteLength - 20; i >= 0; i--) {
        if (tailView.getUint32(i, true) === 0x07064b50) {
          isZip64 = true;
          const z64Offset = tailView.getBigUint64(i + 8, true);
          const z64Buf = await file.slice(Number(z64Offset), Number(z64Offset) + 56).arrayBuffer();
          const z64View = new DataView(z64Buf);
          cdSize = z64View.getBigUint64(40, true);
          cdOffset = z64View.getBigUint64(48, true);
          break;
        }
      }

      if (!isZip64) {
        let eocd = -1;
        for (let i = tailBuf.byteLength - 22; i >= 0; i--) {
          if (tailView.getUint32(i, true) === 0x06054b50) {
            eocd = file.size - tailSize + i;
            break;
          }
        }
        if (eocd === -1) throw new Error("File is not a valid ZIP archive.");
        const eocdSlice = await file.slice(eocd, eocd + 22).arrayBuffer();
        const ev = new DataView(eocdSlice);
        cdSize = BigInt(ev.getUint32(12, true));
        cdOffset = BigInt(ev.getUint32(16, true));
      }

      // 2. Read Central Directory Entries
      const cdBuf = await file.slice(Number(cdOffset), Number(cdOffset + cdSize)).arrayBuffer();
      const cdView = new DataView(cdBuf);
      const files = {};
      let ptr = 0;

      while (ptr < cdBuf.byteLength) {
        if (cdView.getUint32(ptr, true) !== 0x02014b50) break;
        let size = BigInt(cdView.getUint32(ptr + 20, true));
        const nameLen = cdView.getUint16(ptr + 28, true);
        const extraLen = cdView.getUint16(ptr + 30, true);
        const commentLen = cdView.getUint16(ptr + 32, true);
        let localOffset = BigInt(cdView.getUint32(ptr + 42, true));

        const nameBytes = new Uint8Array(cdBuf, ptr + 46, nameLen);
        const name = new TextDecoder().decode(nameBytes);

        if (localOffset === 0xFFFFFFFFn && extraLen > 0) {
          let ePtr = ptr + 46 + nameLen;
          while (ePtr < ptr + 46 + nameLen + extraLen) {
            if (cdView.getUint16(ePtr, true) === 0x0001) {
              localOffset = cdView.getBigUint64(ePtr + 4, true);
              break;
            }
            ePtr += 4 + cdView.getUint16(ePtr + 2, true);
          }
        }

        files[name] = { size: Number(size), localOffset: Number(localOffset) };
        ptr += 46 + nameLen + extraLen + commentLen;
      }

      if (!files['manifest.json']) throw new Error("manifest.json missing inside ZIP.");
      
      // 3. Parse Manifest
      const mEntry = files['manifest.json'];
      const mOffset = await getFileDataOffset(file, mEntry.localOffset);
      const mBuf = await file.slice(mOffset, mOffset + mEntry.size).arrayBuffer();
      const manifest = JSON.parse(new TextDecoder().decode(mBuf));

      log(`Found manifest: ${manifest.name} (${manifest.chunks.length} chunks)`);

      const mimeType = manifest.mime || 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
      if (!MediaSource.isTypeSupported(mimeType)) {
        throw new Error(`MediaSource does not support MIME type: ${mimeType}`);
      }

      // 4. Initialize MediaSource
      const ms = new MediaSource();
      player.src = URL.createObjectURL(ms);

      ms.addEventListener('sourceopen', () => {
        log("MediaSource opened. Configuring SourceBuffer...");
        const sb = ms.addSourceBuffer(mimeType);

        let chunkIndex = 0;
        let isReading = false;
        const TARGET_BUFFER_AHEAD = 15; // Buffer up to 15 seconds ahead

        async function feedBuffer() {
          // Guard: stop if finished, SourceBuffer is busy, or media source closed
          if (ms.readyState !== 'open' || sb.updating || isReading) return;
          if (chunkIndex >= manifest.chunks.length) {
            if (!sb.updating && ms.readyState === 'open') {
              try { ms.endOfStream(); } catch (_) {}
            }
            return;
          }

          // Check how many seconds are currently buffered ahead of the playhead
          const currentTime = player.currentTime;
          let bufferedEnd = 0;
          for (let i = 0; i < sb.buffered.length; i++) {
            if (sb.buffered.start(i) <= currentTime && currentTime <= sb.buffered.end(i)) {
              bufferedEnd = sb.buffered.end(i);
              break;
            }
          }

          const bufferLead = bufferedEnd - currentTime;

          // If we have enough ahead (and this isn't the initial chunk), yield
          if (chunkIndex > 0 && bufferLead > TARGET_BUFFER_AHEAD) {
            return;
          }

          try {
            isReading = true;
            const chunkName = manifest.chunks[chunkIndex];
            const entry = files[chunkName];
            if (!entry) throw new Error(`Missing chunk file: ${chunkName}`);

            const decryptedChunk = await readChunk(file, entry);
            chunkIndex++;
            sb.appendBuffer(decryptedChunk);
          } catch (err) {
            log(`Streaming Error: ${err.message}`);
          } finally {
            isReading = false;
          }
        }

        // Trigger next chunk when buffer finishes appending
        sb.addEventListener('updateend', feedBuffer);

        // Periodically verify buffer depth during playback to fetch new chunks
        player.addEventListener('timeupdate', feedBuffer);
        player.addEventListener('waiting', feedBuffer);

        // Kickstart the first chunk
        feedBuffer();
      });

      card.style.display = 'none';
      container.style.display = 'block';
      player.play().catch(() => {});

    } catch (err) {
      log("ERROR: " + err.message);
      console.error(err);
    }
  });
</script>
</body>
</html>
