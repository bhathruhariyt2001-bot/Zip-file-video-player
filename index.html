---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VLC Player Debug Engine</title>
  <style>
    :root { --vlc: #ff8800; --bg: #000; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    /* Standard standard input button - impossible for Android to block */
    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #1f2937;
      color: #fff;
      border: 1px dashed var(--vlc);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #debugBox {
      background: #000;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #videoContainer {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      z-index: 999;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="card" id="uiCard">
    <h2 style="color:var(--vlc);">VLC Stream Player</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">Tap below to pick the scrambled .zip file.</p>
    
    <!-- Direct, unstyled native file picker -->
    <input type="file" id="directPicker" />

    <div id="debugBox">Status: Waiting for file selection...</div>
  </div>

  <div id="videoContainer">
    <video id="player" controls playsinline></video>
  </div>

<script>
  const XOR_KEY = 0xAA;
  const picker = document.getElementById('directPicker');
  const debug = document.getElementById('debugBox');
  const card = document.getElementById('uiCard');
  const container = document.getElementById('videoContainer');
  const player = document.getElementById('player');

  function log(msg) {
    debug.innerText += "\n> " + msg;
    debug.scrollTop = debug.scrollHeight;
  }

  picker.addEventListener('change', async (e) => {
    try {
      const file = e.target.files && e.target.files[0];
      if (!file) {
        log("No file selected.");
        return;
      }

      log(`File picked: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`);
      log("Scanning ZIP End-of-Central-Directory...");

      // 1. Locate EOCD or ZIP64
      const tailSize = Math.min(file.size, 131072);
      const tailBuf = await file.slice(file.size - tailSize, file.size).arrayBuffer();
      const tailView = new DataView(tailBuf);
      
      let cdOffset = 0n;
      let cdSize = 0n;
      let isZip64 = false;

      for (let i = tailBuf.byteLength - 20; i >= 0; i--) {
        if (tailView.getUint32(i, true) === 0x07064b50) {
          isZip64 = true;
          const z64Offset = tailView.getBigUint64(i + 8, true);
          const z64Buf = await file.slice(Number(z64Offset), Number(z64Offset) + 56).arrayBuffer();
          const z64View = new DataView(z64Buf);
          cdSize = z64View.getBigUint64(40, true);
          cdOffset = z64View.getBigUint64(48, true);
          break;
        }
      }

      if (!isZip64) {
        let eocd = -1;
        for (let i = tailBuf.byteLength - 22; i >= 0; i--) {
          if (tailView.getUint32(i, true) === 0x06054b50) {
            eocd = file.size - tailSize + i;
            break;
          }
        }
        if (eocd === -1) throw new Error("File is not a valid ZIP archive.");
        const eocdSlice = await file.slice(eocd, eocd + 22).arrayBuffer();
        const ev = new DataView(eocdSlice);
        cdSize = BigInt(ev.getUint32(12, true));
        cdOffset = BigInt(ev.getUint32(16, true));
      }

      log(`Found Directory: Offset ${cdOffset}, Size ${cdSize} bytes`);

      // 2. Read Central Directory
      const cdBuf = await file.slice(Number(cdOffset), Number(cdOffset + cdSize)).arrayBuffer();
      const cdView = new DataView(cdBuf);
      const files = {};
      let ptr = 0;

      while (ptr < cdBuf.byteLength) {
        if (cdView.getUint32(ptr, true) !== 0x02014b50) break;
        let size = BigInt(cdView.getUint32(ptr + 20, true));
        const nameLen = cdView.getUint16(ptr + 28, true);
        const extraLen = cdView.getUint16(ptr + 30, true);
        const commentLen = cdView.getUint16(ptr + 32, true);
        let localOffset = BigInt(cdView.getUint32(ptr + 42, true));

        const nameBytes = new Uint8Array(cdBuf, ptr + 46, nameLen);
        const name = new TextDecoder().decode(nameBytes);

        if (localOffset === 0xFFFFFFFFn && extraLen > 0) {
          let ePtr = ptr + 46 + nameLen;
          while (ePtr < ptr + 46 + nameLen + extraLen) {
            if (cdView.getUint16(ePtr, true) === 0x0001) {
              localOffset = cdView.getBigUint64(ePtr + 4, true);
              break;
            }
            ePtr += 4 + cdView.getUint16(ePtr + 2, true);
          }
        }

        files[name] = { size: Number(size), localOffset: Number(localOffset), nameLen };
        ptr += 46 + nameLen + extraLen + commentLen;
      }

      if (!files['manifest.json']) throw new Error("manifest.json missing inside ZIP.");
      log("Found manifest.json! Parsing video details...");

      // 3. Read Manifest
      const m = files['manifest.json'];
      const mBuf = await file.slice(m.localOffset + 30 + m.nameLen, m.localOffset + 30 + m.nameLen + m.size).arrayBuffer();
      const manifest = JSON.parse(new TextDecoder().decode(mBuf));

      log(`Ready to play: ${manifest.name} (${manifest.chunks.length} chunks)`);

      // 4. Extract first 15MB to launch playback immediately
      log("Extracting startup chunks...");
      const startupCount = Math.min(15, manifest.chunks.length);
      const chunks = [];

      for (let i = 0; i < startupCount; i++) {
        const cName = manifest.chunks[i];
        const entry = files[cName];
        const raw = await file.slice(entry.localOffset + 30 + entry.nameLen, entry.localOffset + 30 + entry.nameLen + entry.size).arrayBuffer();
        const u8 = new Uint8Array(raw);
        for (let b = 0; b < u8.length; b++) u8[b] ^= XOR_KEY;
        chunks.push(u8);
      }

      log("Mounting video player...");
      const blob = new Blob(chunks, { type: manifest.mime });
      player.src = URL.createObjectURL(blob);
      
      card.style.display = 'none';
      container.style.display = 'block';

      if (container.requestFullscreen) container.requestFullscreen().catch(() => {});
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});

      player.play();

    } catch (err) {
      log("ERROR: " + err.message);
      console.error(err);
    }
  });
</script>
</body>
</html>
