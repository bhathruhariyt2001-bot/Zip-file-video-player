---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Advanced Video Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #selectModal {
      position: absolute;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #111827;
      padding: 32px 36px;
      border-radius: 16px;
      border: 1px solid #1f2937;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      max-width: 90vw;
    }
    #selectModal h2 { font-size: 1.2rem; font-weight: 600; color: #f3f4f6; }
    #selectModal p { font-size: 0.85rem; color: #9ca3af; line-height: 1.4; }
    .select-btn {
      background: #10b981;
      color: #04291c;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.95rem;
      border: none;
      transition: opacity 0.2s;
    }
    .select-btn:hover { opacity: 0.9; }
    input[type="file"] { display: none; }

    #playerContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    .controls-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .controls-overlay.active { opacity: 1; pointer-events: auto; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }

    .bottom-bar { display: flex; flex-direction: column; gap: 10px; }
    .progress-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      cursor: pointer;
    }
    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #10b981;
    }
    .btn-row { display: flex; justify-content: space-between; align-items: center; }
    .left-btns, .right-btns { display: flex; align-items: center; gap: 14px; }
    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .time-badge { font-size: 0.8rem; color: #d1d5db; font-family: monospace; }
    .speed-select {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
      outline: none;
    }
    .speed-select option { background: #111; color: #fff; }

    .seek-ripple {
      position: absolute;
      top: 0; bottom: 0; width: 40%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
    }
    #rippleLeft { left: 0; border-radius: 0 50% 50% 0; }
    #rippleRight { right: 0; border-radius: 50% 0 0 50%; }
    .ripple-active { opacity: 1 !important; }
  </style>
</head>
<body>

<div id="selectModal">
  <h2>Watch Encrypted Video</h2>
  <p>Select your scrambled .ZIP file. It will play directly in fullscreen without RAM buildup.</p>
  <label class="select-btn">
    Pick .ZIP File
    <input type="file" id="zipInput" accept=".zip" />
  </label>
</div>

<div id="playerContainer">
  <video id="videoElement" playsinline></video>

  <div class="seek-ripple" id="rippleLeft">-10s</div>
  <div class="seek-ripple" id="rippleRight">+10s</div>

  <div class="controls-overlay" id="controls">
    <div class="top-bar">
      <span class="title-text" id="videoTitle">Playing Stream</span>
      <button class="icon-btn" id="pipBtn" title="Picture in Picture">🗗</button>
    </div>

    <div class="bottom-bar">
      <input type="range" class="progress-slider" id="seekBar" value="0" min="0" max="100" step="0.1" />

      <div class="btn-row">
        <div class="left-btns">
          <button class="icon-btn" id="playBtn">▶</button>
          <button class="icon-btn" id="rewindBtn">↺ 10s</button>
          <button class="icon-btn" id="forwardBtn">↻ 10s</button>
          <span class="time-badge" id="timeDisplay">0:00 / 0:00</span>
        </div>

        <div class="right-btns">
          <select class="speed-select" id="speedSelect">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
          <button class="icon-btn" id="fitBtn">⛶</button>
          <button class="icon-btn" id="fsBtn">⛶</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const XOR_KEY = 0xAA;
  const selectModal = document.getElementById('selectModal');
  const zipInput = document.getElementById('zipInput');
  const playerContainer = document.getElementById('playerContainer');
  const video = document.getElementById('videoElement');
  const controls = document.getElementById('controls');
  const playBtn = document.getElementById('playBtn');
  const seekBar = document.getElementById('seekBar');
  const timeDisplay = document.getElementById('timeDisplay');
  const videoTitle = document.getElementById('videoTitle');
  const speedSelect = document.getElementById('speedSelect');
  const fsBtn = document.getElementById('fsBtn');
  const fitBtn = document.getElementById('fitBtn');
  const pipBtn = document.getElementById('pipBtn');
  const rewindBtn = document.getElementById('rewindBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const rippleLeft = document.getElementById('rippleLeft');
  const rippleRight = document.getElementById('rippleRight');

  let hideTimeout;

  // Zero-RAM Built-in ZIP Directory Parser (Reads offsets directly from disk)
  async function parseZipDirectory(file) {
    const tailSize = Math.min(file.size, 65536);
    const tailBuf = await file.slice(file.size - tailSize, file.size).arrayBuffer();
    const tailView = new DataView(tailBuf);
    let eocdOffset = -1;

    for (let i = tailBuf.byteLength - 22; i >= 0; i--) {
      if (tailView.getUint32(i, true) === 0x06054b50) {
        eocdOffset = file.size - tailSize + i;
        break;
      }
    }
    if (eocdOffset === -1) throw new Error('Invalid ZIP structure');

    const eocdSlice = await file.slice(eocdOffset, eocdOffset + 22).arrayBuffer();
    const ev = new DataView(eocdSlice);
    const cdSize = ev.getUint32(12, true);
    const cdOffset = ev.getUint32(16, true);

    const cdBuf = await file.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
    const cdView = new DataView(cdBuf);
    const files = {};
    let ptr = 0;

    while (ptr < cdBuf.byteLength) {
      if (cdView.getUint32(ptr, true) !== 0x02014b50) break;
      const size = cdView.getUint32(ptr + 20, true);
      const nameLen = cdView.getUint16(ptr + 28, true);
      const extraLen = cdView.getUint16(ptr + 30, true);
      const commentLen = cdView.getUint16(ptr + 32, true);
      const localOffset = cdView.getUint32(ptr + 42, true);

      const nameBytes = new Uint8Array(cdBuf, ptr + 46, nameLen);
      const name = new TextDecoder().decode(nameBytes);

      files[name] = { size, localOffset, nameLen };
      ptr += 46 + nameLen + extraLen + commentLen;
    }
    return files;
  }

  zipInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    selectModal.style.display = 'none';

    // Request native fullscreen
    if (playerContainer.requestFullscreen) {
      playerContainer.requestFullscreen().catch(() => {});
    } else if (playerContainer.webkitRequestFullscreen) {
      playerContainer.webkitRequestFullscreen();
    }

    try {
      const dir = await parseZipDirectory(file);
      if (!dir['manifest.json']) throw new Error('manifest.json missing');

      const mEntry = dir['manifest.json'];
      const mDataOffset = mEntry.localOffset + 30 + mEntry.nameLen;
      const mBuf = await file.slice(mDataOffset, mDataOffset + mEntry.size).arrayBuffer();
      const manifest = JSON.parse(new TextDecoder().decode(mBuf));

      videoTitle.innerText = manifest.name;

      const restoredParts = [];
      for (let i = 0; i < manifest.chunks.length; i++) {
        const cName = manifest.chunks[i];
        const cEntry = dir[cName];
        if (!cEntry) continue;

        const dataOffset = cEntry.localOffset + 30 + cEntry.nameLen;
        const cBuf = await file.slice(dataOffset, dataOffset + cEntry.size).arrayBuffer();
        const u8 = new Uint8Array(cBuf);

        // De-scramble byte in-place
        for (let b = 0; b < u8.length; b++) u8[b] ^= XOR_KEY;
        restoredParts.push(u8);
      }

      const blob = new Blob(restoredParts, { type: manifest.mime });
      video.src = URL.createObjectURL(blob);
      video.play();
      resetControlsTimer();
    } catch (err) {
      alert('Error loading ZIP: ' + err.message);
      selectModal.style.display = 'flex';
    }
  });

  function togglePlay() {
    if (video.paused) { video.play(); playBtn.innerText = '⏸'; }
    else { video.pause(); playBtn.innerText = '▶'; }
    resetControlsTimer();
  }
  playBtn.onclick = togglePlay;
  video.onclick = togglePlay;

  video.ontimeupdate = () => {
    if (!video.duration) return;
    seekBar.value = (video.currentTime / video.duration) * 100;
    timeDisplay.innerText = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
  };

  seekBar.oninput = () => video.currentTime = (seekBar.value / 100) * video.duration;

  rewindBtn.onclick = () => seekRelative(-10);
  forwardBtn.onclick = () => seekRelative(10);

  function seekRelative(sec) {
    video.currentTime = Math.max(0, Math.min(video.currentTime + sec, video.duration));
    const ripple = sec < 0 ? rippleLeft : rippleRight;
    ripple.classList.add('ripple-active');
    setTimeout(() => ripple.classList.remove('ripple-active'), 400);
    resetControlsTimer();
  }

  playerContainer.ondblclick = (e) => {
    const rect = playerContainer.getBoundingClientRect();
    if ((e.clientX - rect.left) < rect.width / 2) seekRelative(-10);
    else seekRelative(10);
  };

  speedSelect.onchange = () => video.playbackRate = parseFloat(speedSelect.value);

  let isCover = false;
  fitBtn.onclick = () => {
    isCover = !isCover;
    video.style.objectFit = isCover ? 'cover' : 'contain';
  };

  pipBtn.onclick = async () => {
    if (document.pictureInPictureElement) document.exitPictureInPicture();
    else if (video.requestPictureInPicture) await video.requestPictureInPicture();
  };

  fsBtn.onclick = () => {
    if (!document.fullscreenElement) playerContainer.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  };

  function resetControlsTimer() {
    controls.classList.add('active');
    clearTimeout(hideTimeout);
    if (!video.paused) hideTimeout = setTimeout(() => controls.classList.remove('active'), 3000);
  }
  playerContainer.onmousemove = resetControlsTimer;
  playerContainer.ontouchstart = resetControlsTimer;

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') seekRelative(10);
    if (e.code === 'ArrowLeft') seekRelative(-10);
    if (e.code === 'ArrowUp') video.volume = Math.min(1, video.volume + 0.1);
    if (e.code === 'ArrowDown') video.volume = Math.max(0, video.volume - 0.1);
    if (e.key.toLowerCase() === 'f') fsBtn.click();
    if (e.key.toLowerCase() === 'm') video.muted = !video.muted;
  });

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
  }
</script>
</body>
</html>
